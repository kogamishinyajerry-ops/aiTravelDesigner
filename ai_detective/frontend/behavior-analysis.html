<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 侦探 - 行为分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: white;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            resize: vertical;
            transition: all 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            color: white;
            font-size: 1em;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            margin-right: 8px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .loading {
            display: none;
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .analysis-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .analysis-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .analysis-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .status-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .status-badge.positive {
            background: #dcfce7;
            color: #166534;
        }

        .status-badge.negative {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-badge.warning {
            background: #fef9c3;
            color: #854d0e;
        }

        .status-badge.info {
            background: #dbeafe;
            color: #1e40af;
        }

        .analysis-content {
            line-height: 1.6;
            color: #555;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: #f9fafb;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .metric-label {
            color: #666;
            font-size: 0.9em;
        }

        .indicators-list {
            list-style: none;
            margin-top: 15px;
        }

        .indicators-list li {
            padding: 10px 15px;
            background: #f3f4f6;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .indicator-text {
            flex: 1;
        }

        .indicator-confidence {
            background: #dbeafe;
            color: #1e40af;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .risk-assessment {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
        }

        .risk-level {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .risk-findings {
            font-size: 1.1em;
        }

        .risk-findings ul {
            list-style: none;
            margin-top: 15px;
        }

        .risk-findings li {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .error-message {
            background: #fee2e2;
            border: 2px solid #ef4444;
            border-radius: 10px;
            padding: 15px;
            color: #991b1b;
            display: none;
        }

        .error-message.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🕵️ AI 侦探 - 行为分析</h1>
            <p>预谋性 · 惯犯识别 · 团伙作案分析</p>
        </div>

        <div class="glass-card">
            <div class="input-group">
                <label for="caseDescription">案件描述</label>
                <textarea id="caseDescription" placeholder="请详细描述案件经过，包括时间、地点、人员、事件等...">今年12月15日下午3点左右,一个女生来到我的店铺。
她在店里待了大约1个小时,大概4点左右支付了400余元。
支付后她立刻要求退款,双方发生争执。
对方现场报警并拍照取证。
晚上6点47分,她在小红书发布了一篇笔记,称店铺诈骗。
第二天,我收到了行政处罚。</textarea>
            </div>

            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="analyzePremeditation" checked> 预谋性分析
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="analyzeHabitual" checked> 惯犯识别
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="analyzeGroup" checked> 团伙作案分析
                </label>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="analyzeBehavior()">🔍 开始分析</button>
                <button class="btn-secondary" onclick="clearForm()">🔄 清空</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在分析中，请稍候...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="results" id="results">
            <div class="risk-assessment glass-card" id="riskAssessment">
                <div class="risk-level" id="riskLevel">风险评估中...</div>
                <div class="risk-findings" id="riskFindings"></div>
            </div>

            <div class="analysis-card" id="premeditationCard" style="display: none;">
                <div class="analysis-header">
                    <div class="analysis-title">🎯 预谋性分析</div>
                    <span class="status-badge" id="premeditationBadge">分析中</span>
                </div>
                <div class="analysis-content" id="premeditationContent"></div>
            </div>

            <div class="analysis-card" id="habitualCard" style="display: none;">
                <div class="analysis-header">
                    <div class="analysis-title">🔍 惯犯识别</div>
                    <span class="status-badge" id="habitualBadge">分析中</span>
                </div>
                <div class="analysis-content" id="habitualContent"></div>
            </div>

            <div class="analysis-card" id="groupCard" style="display: none;">
                <div class="analysis-header">
                    <div class="analysis-title">👥 团伙作案分析</div>
                    <span class="status-badge" id="groupBadge">分析中</span>
                </div>
                <div class="analysis-content" id="groupContent"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        async function analyzeBehavior() {
            const description = document.getElementById('caseDescription').value.trim();
            
            if (!description) {
                showError('请输入案件描述');
                return;
            }

            const analyzePremeditation = document.getElementById('analyzePremeditation').checked;
            const analyzeHabitual = document.getElementById('analyzeHabitual').checked;
            const analyzeGroup = document.getElementById('analyzeGroup').checked;

            if (!analyzePremeditation && !analyzeHabitual && !analyzeGroup) {
                showError('请至少选择一种分析类型');
                return;
            }

            hideError();
            showLoading();
            hideResults();

            try {
                const response = await fetch(`${API_URL}/behavior-analysis`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        description: description,
                        context: {},
                        analyze_premeditation: analyzePremeditation,
                        analyze_habitual: analyzeHabitual,
                        analyze_group: analyzeGroup
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                console.error('Error:', error);
                showError('分析失败：' + error.message);
            } finally {
                hideLoading();
            }
        }

        function displayResults(data) {
            showResults();

            // 显示风险评估
            displayRiskAssessment(data.comprehensive_assessment);

            // 显示预谋性分析
            if (data.premeditation) {
                displayPremeditation(data.premeditation);
            }

            // 显示惯犯识别
            if (data.habitual_offender) {
                displayHabitual(data.habitual_offender);
            }

            // 显示团伙分析
            if (data.group_crime) {
                displayGroup(data.group_crime);
            }
        }

        function displayRiskAssessment(assessment) {
            const riskLevelDiv = document.getElementById('riskLevel');
            const riskFindingsDiv = document.getElementById('riskFindings');

            riskLevelDiv.textContent = assessment.overall_risk_level + '风险';

            if (assessment.key_findings.length > 0) {
                riskFindingsDiv.innerHTML = '<p>关键发现：</p><ul>' +
                    assessment.key_findings.map(f => `<li>⚠️ ${f}</li>`).join('') +
                    '</ul>';
            } else {
                riskFindingsDiv.innerHTML = '<p>✅ 未发现重大风险</p>';
            }
        }

        function displayPremeditation(data) {
            const card = document.getElementById('premeditationCard');
            const badge = document.getElementById('premeditationBadge');
            const content = document.getElementById('premeditationContent');

            card.style.display = 'block';

            if (data.is_premeditated) {
                badge.textContent = '✅ 预谋作案';
                badge.className = 'status-badge positive';
            } else {
                badge.textContent = '❌ 非预谋';
                badge.className = 'status-badge negative';
            }

            let html = `
                <div class="metric-grid">
                    <div class="metric-card">
                        <div class="metric-value">${(data.score * 100).toFixed(0)}%</div>
                        <div class="metric-label">预谋得分</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${data.level}</div>
                        <div class="metric-label">预谋等级</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${data.indicators.length}</div>
                        <div class="metric-label">预谋指标</div>
                    </div>
                </div>
            `;

            if (data.indicators.length > 0) {
                html += '<h4>预谋指标：</h4><ul class="indicators-list">' +
                    data.indicators.map(ind => `
                        <li>
                            <span class="indicator-text">• ${ind.description}</span>
                            <span class="indicator-confidence">${(ind.confidence * 100).toFixed(0)}%</span>
                        </li>
                    `).join('') +
                    '</ul>';
            }

            if (data.action_route.length > 0) {
                html += `<h4>行动路线：</h4><p>${data.action_route.join(' → ')}</p>`;
            }

            if (data.reasoning) {
                html += `<h4>推理说明：</h4><p style="white-space: pre-wrap;">${data.reasoning}</p>`;
            }

            content.innerHTML = html;
        }

        function displayHabitual(data) {
            const card = document.getElementById('habitualCard');
            const badge = document.getElementById('habitualBadge');
            const content = document.getElementById('habitualContent');

            card.style.display = 'block';

            if (data.is_habitual_offender) {
                badge.textContent = '✅ 疑似惯犯';
                badge.className = 'status-badge positive';
            } else {
                badge.textContent = '❌ 非惯犯';
                badge.className = 'status-badge negative';
            }

            let html = `
                <div class="metric-grid">
                    <div class="metric-card">
                        <div class="metric-value">${(data.probability * 100).toFixed(0)}%</div>
                        <div class="metric-label">惯犯概率</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${data.level}</div>
                        <div class="metric-label">惯犯等级</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${data.similar_posts.length}</div>
                        <div class="metric-label">相似帖子</div>
                    </div>
                </div>
            `;

            if (data.similar_posts.length > 0) {
                html += '<h4>相似历史帖子：</h4><ul class="indicators-list">' +
                    data.similar_posts.map(post => `
                        <li>
                            <span class="indicator-text">
                                <strong>${post.platform}:</strong> "${post.content}"
                            </span>
                            <span class="indicator-confidence">相似度 ${(post.similarity * 100).toFixed(0)}%</span>
                        </li>
                    `).join('') +
                    '</ul>';
            }

            if (data.modus_operandi.length > 0) {
                html += '<h4>作案手法：</h4><ul>' +
                    data.modus_operandi.map(m => `<li>• ${m}</li>`).join('') +
                    '</ul>';
            }

            if (data.reasoning) {
                html += `<h4>推理说明：</h4><p style="white-space: pre-wrap;">${data.reasoning}</p>`;
            }

            content.innerHTML = html;
        }

        function displayGroup(data) {
            const card = document.getElementById('groupCard');
            const badge = document.getElementById('groupBadge');
            const content = document.getElementById('groupContent');

            card.style.display = 'block';

            if (data.is_group_crime) {
                badge.textContent = '✅ 团伙作案';
                badge.className = 'status-badge positive';
            } else {
                badge.textContent = '❌ 非团伙';
                badge.className = 'status-badge negative';
            }

            let html = `
                <div class="metric-grid">
                    <div class="metric-card">
                        <div class="metric-value">${(data.probability * 100).toFixed(0)}%</div>
                        <div class="metric-label">团伙概率</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${data.group_size}</div>
                        <div class="metric-label">团伙人数</div>
                    </div>
                </div>
            `;

            if (data.persons.length > 0) {
                html += '<h4>涉及人员：</h4><ul>' +
                    data.persons.map(p => `<li>• ${p.name} (${p.role})</li>`).join('') +
                    '</ul>';
            }

            if (data.coordination_evidence.length > 0) {
                html += '<h4>配合证据：</h4><ul>' +
                    data.coordination_evidence.map(e => `<li>• ${e}</li>`).join('') +
                    '</ul>';
            }

            if (data.reasoning) {
                html += `<h4>推理说明：</h4><p style="white-space: pre-wrap;">${data.reasoning}</p>`;
            }

            content.innerHTML = html;
        }

        function showLoading() {
            document.getElementById('loading').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
        }

        function showResults() {
            document.getElementById('results').classList.add('active');
        }

        function hideResults() {
            document.getElementById('results').classList.remove('active');
            document.getElementById('premeditationCard').style.display = 'none';
            document.getElementById('habitualCard').style.display = 'none';
            document.getElementById('groupCard').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.remove('active');
        }

        function clearForm() {
            document.getElementById('caseDescription').value = '';
            hideResults();
            hideError();
        }
    </script>
</body>
</html>
